<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bilet Topish</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --text-muted: #707579;
      --primary: #00a884;
      --primary-hover: #008f70;
      --border-color: #e2e8f0;
      --active-bg: #e6f7f3;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      margin-bottom: 12px;
    }

    .form-header {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .route-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .select-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .select-box label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    select, input[type="date"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      background: #fafafa;
      box-sizing: border-box;
      outline: none;
    }

    .swap-btn {
      background: var(--active-bg);
      border: 1px solid var(--primary);
      color: var(--primary);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-top: 14px;
      flex-shrink: 0;
    }

    .action-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn:hover { background: var(--primary-hover); }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .train-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .train-option {
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
      background: #fafafa;
    }

    .train-option.selected {
      border-color: var(--primary);
      background-color: var(--active-bg);
    }

    .radio-circle {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .train-option.selected .radio-circle {
      border-color: var(--primary);
      background: var(--primary);
    }

    .radio-circle::after {
      content: "";
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      display: none;
    }

    .train-option.selected .radio-circle::after { display: block; }

    .train-details { flex: 1; }
    .train-time { font-size: 16px; font-weight: 800; }
    .train-time span { font-size: 12px; font-weight: 500; color: var(--text-muted); }
    .train-info { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .loader {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="form-header">🚅 Poyezd Biletini Bron Qilish</div>

    <div class="route-selector">
      <div class="select-box">
        <label>Qayerdan</label>
        <select id="fromStation">
          <option value="2900000" data-name="Toshkent">Toshkent</option>
          <option value="2900500" data-name="HAZORASP" selected>HAZORASP</option>
          <option value="2900700" data-name="Samarqand">Samarqand</option>
          <option value="2900900" data-name="Buxoro">Buxoro</option>
          <option value="2900600" data-name="Xiva">Xiva</option>
          <option value="2900400" data-name="Urganch">Urganch</option>
          <option value="2900100" data-name="Nukus">Nukus</option>
        </select>
      </div>

      <button class="swap-btn" onclick="swapStations()">⇄</button>

      <div class="select-box">
        <label>Qayerga</label>
        <select id="toStation">
          <option value="2900000" data-name="Toshkent" selected>Toshkent</option>
          <option value="2900500" data-name="HAZORASP">HAZORASP</option>
          <option value="2900700" data-name="Samarqand">Samarqand</option>
          <option value="2900900" data-name="Buxoro">Buxoro</option>
          <option value="2900600" data-name="Xiva">Xiva</option>
          <option value="2900400" data-name="Urganch">Urganch</option>
        </select>
      </div>
    </div>

    <div class="select-box" style="margin-bottom: 12px;">
      <label>Borish Sanasi</label>
      <input type="date" id="travelDate">
    </div>

    <button class="action-btn" onclick="fetchLiveTrains()">IZLASH</button>
  </div>

  <div class="card" id="resultsCard" style="display: none;">
    <div class="section-title">MAVJUD POYEZD REYSLARI</div>
    
    <div id="loader" class="loader">🔄 Saytdan ma'lumotlar olinmoqda...</div>
    <div id="trainList" class="train-list"></div>

    <button class="action-btn" style="margin-top: 14px;" onclick="submitBooking()">KEYINGI</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Bugungi sanani o'rnatish
    const dateInput = document.getElementById('travelDate');
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;

    // Serveringiz manzili (Backend loyiha manzili)
    const SERVER_URL = 'https://poyezd-bot.onrender.com'; // O'zingizning сервер manzilingizni qo'yasiz

    let selectedTrainData = null;

    function swapStations() {
      const fromSelect = document.getElementById('fromStation');
      const toSelect = document.getElementById('toStation');
      const temp = fromSelect.value;
      fromSelect.value = toSelect.value;
      toSelect.value = temp;
    }

    async function fetchLiveTrains() {
      const fromSelect = document.getElementById('fromStation');
      const toSelect = document.getElementById('toStation');
      const date = document.getElementById('travelDate').value;

      const fromCode = fromSelect.value;
      const toCode = toSelect.value;
      
      const resultsCard = document.getElementById('resultsCard');
      const loader = document.getElementById('loader');
      const trainList = document.getElementById('trainList');

      resultsCard.style.display = 'block';
      loader.style.display = 'block';
      trainList.innerHTML = '';

      try {
        // Real Temir yo'l API serveriga so'rov yuborish
        const response = await fetch(`${SERVER_URL}/api/trains?from=${fromCode}&to=${toCode}&date=${date}`);
        const data = await response.json();

        loader.style.display = 'none';

        if (!data.trains || data.trains.length === 0) {
          trainList.innerHTML = '<div style="text-align:center; padding:10px; color:var(--text-muted);">Ushbu sanada reyslar topilmadi</div>';
          selectedTrainData = null;
          return;
        }

        // Jonli reyslarni chiqarish
        data.trains.forEach((t, index) => {
          const option = document.createElement('div');
          option.className = `train-option ${index === 0 ? 'selected' : ''}`;
          if (index === 0) selectedTrainData = t;

          option.onclick = () => {
            document.querySelectorAll('.train-option').forEach(el => el.classList.remove('selected'));
            option.classList.add('selected');
            selectedTrainData = t;
          };

          option.innerHTML = `
            <div class="radio-circle"></div>
            <div class="train-details">
              <div class="train-time">${t.depTime} <span>➔ ${t.arrTime} (${t.duration})</span></div>
              <div class="train-info">Poyezd: ${t.number} (${t.type})</div>
            </div>
          `;
          trainList.appendChild(option);
        });

      } catch (err) {
        loader.style.display = 'none';
        trainList.innerHTML = '<div style="text-align:center; color:red;">Server bilan bog\'lanishda xatolik yuz berdi</div>';
      }
    }

    function submitBooking() {
      if (!selectedTrainData) {
        alert('Iltimos, reysni tanlang!');
        return;
      }

      const fromName = document.getElementById('fromStation').selectedOptions[0].getAttribute('data-name');
      const toName = document.getElementById('toStation').selectedOptions[0].getAttribute('data-name');

      const resultText = `siz (${fromName.toLowerCase()} - ${toName.toLowerCase()}) yo'nalishining soat ${selectedTrainData.depTime} dagi poyezdini tanladingiz.`;

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({
          message: resultText,
          train: selectedTrainData
        }));
      } else {
        alert(resultText);
      }
    }
  </script>
</body>
</html>
